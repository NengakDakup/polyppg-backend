<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PolyPPG Live Monitor</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 2rem; background: #0f172a; color: #f8fafc; }
    .container { max-width: 1000px; margin: 0 auto; }
    .card { background: #1e293b; padding: 1.5rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); margin-bottom: 1.5rem; border: 1px solid #334155; }
    h1, h2 { margin-top: 0; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
    .badge-connected { background: #065f46; color: #34d399; }
    .badge-disconnected { background: #7f1d1d; color: #f87171; }
    textarea { width: 100%; height: 210px; box-sizing: border-box; font-family: monospace; font-size: 13px; padding: 10px; background: #0f172a; color: #38bdf8; border: 1px solid #475569; border-radius: 6px; }
    button { padding: 10px 18px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; margin-top: 10px; font-weight: bold; }
    button:hover { background: #1d4ed8; }
    pre { background: #020617; color: #a5f3fc; padding: 1rem; border-radius: 6px; overflow-x: auto; max-height: 400px; border: 1px solid #1e293b; font-size: 13px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>PolyPPG Live Stream & Telemetry Server</h1>
      <p>WebSocket Status: <span id="status" class="badge badge-disconnected">Connecting...</span></p>
      <h2>Simulate Device POST (/api/data)</h2>
      <textarea id="payloadInput">{
  "device_id": "polyppg-001",
  "hr": 72.4,
  "spo2": 97.8,
  "hbs_percent": 34.2,
  "vrs": 0.42,
  "alert_level": "AMBER",
  "env_temperature": 27.3,
  "skin_temperature": 34.5,
  "humidity": 61.2,
  "altitude": 187.5
}</textarea><br>
      <button id="sendBtn">Send Reading POST</button>
    </div>
    <div class="card">
      <h2>Live WebSocket Updates (Newest First)</h2>
      <pre id="liveFeed"></pre>
    </div>
  </div>
  <script>
    const statusBadge = document.getElementById("status");
    const liveFeed = document.getElementById("liveFeed");
    const wsProto = window.location.protocol === "https:" ? "wss:" : "ws:";
    const ws = new WebSocket(wsProto + "//" + window.location.host);
    ws.onopen = () => {
      statusBadge.textContent = "Connected";
      statusBadge.className = "badge badge-connected";
    };
    ws.onclose = () => {
      statusBadge.textContent = "Disconnected";
      statusBadge.className = "badge badge-disconnected";
    };
    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      liveFeed.textContent = JSON.stringify(data, null, 2) + "\n\n" + liveFeed.textContent;
    };
    document.getElementById("sendBtn").addEventListener("click", async () => {
      try {
        const body = JSON.parse(document.getElementById("payloadInput").value);
        const res = await fetch("/api/data", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        const result = await res.json();
        console.log("Saved:", result);
      } catch (err) {
        alert("Error: " + err.message);
      }
    });
  </script>
</body>
</html>
